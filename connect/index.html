  <script>
    (function () {
      var URL_ = 'https://www.linkedin.com/in/jennyplunkett';
      var status = document.getElementById('status');
      var say = function (text) { status.textContent = text; };
      var track = function (name, props) { if (window.plausible) window.plausible(name, props ? { props: props } : undefined); };

      document.getElementById('open').addEventListener('click', function () { track('LinkedIn Open'); });

      document.getElementById('share').addEventListener('click', function () {
        if (navigator.share) {
          navigator.share({ title: 'Jenny Speelman on LinkedIn', url: URL_ })
            .then(function () { track('LinkedIn Share', { method: 'native_share' }); })
            .catch(function () { /* cancelled */ });
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(URL_).then(function () { say('Link copied!'); track('LinkedIn Share', { method: 'copy' }); });
        } else {
          say(URL_);
        }
      });

      // Keep the screen from dimming while someone is scanning
      var lock = null;
      function keepAwake() {
        if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
        navigator.wakeLock.request('screen').then(function (l) {
          lock = l;
          say('Screen stays on while this is open');
          lock.addEventListener('release', function () { say('Ready'); });
        }).catch(function () { /* not allowed (e.g. low battery) */ });
      }
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') keepAwake(); });
      keepAwake();

      // Works offline once visited (conference wifi...)
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    })();
  </script>
